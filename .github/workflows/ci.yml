name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: testes (${{ matrix.so }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # O `shell: bash` nao e enfeite: no PowerShell do runner o glob chega ao
      # node como texto literal.
      - name: "as regras e os numeros do README"
        shell: bash
        run: node --test testes/nucleo.test.js testes/medidas.test.js
      - name: "o juiz do desenho nas 655.984 posicoes"
        shell: bash
        run: node --test testes/pesados.test.js

  medidas:
    name: tabelas do README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "a busca completa"
        run: node ferramentas/medidor.js solucao
      - name: "as duas arvores depois de cada abertura"
        run: node ferramentas/medidor.js arvores
      - name: "a estrategia contra todas as respostas"
        run: node ferramentas/medidor.js estrategia
      - name: "os tabuleiros cheios"
        run: node ferramentas/medidor.js cheios
